# ============================================================
# VerifyLens — Central Configuration
# ============================================================

# ── Extraction Mode ──────────────────────────────────────────
# Controls which document extraction approach is used at runtime.
#
#   ocr_llm  →  Approach 1: image → PaddleOCR → Qwen2.5-1.5B text LLM → JSON
#   vlm      →  Approach 2: image → Qwen2.5-VL-2B (mlx-vlm) → JSON
#
# Change this value and restart the server to switch approaches.
extraction:
  mode: "ocr_llm"

  # ── VLM (Approach 2) ───────────────────────────────────────
  vlm_model: "mlx-community/Qwen2.5-VL-2B-Instruct-4bit"
  vlm_max_new_tokens: 256
  vlm_temperature: 0.0
  vlm_resize_max_px: 1120

  # ── OCR + LLM (Approach 1) ─────────────────────────────────
  ocr_llm_model: "mlx-community/Qwen2.5-1.5B-Instruct-4bit"
  ocr_llm_adapter_path: "checkpoints/verifylens-adapter"
  ocr_llm_max_tokens: 128


# ── Model Specs (reference / training) ──────────────────────
model:
  # Approach 2 VLM — used by vlm_extractor.py via mlx-vlm
  vlm:
    name: "mlx-community/Qwen2.5-VL-2B-Instruct-4bit"
    framework: "mlx-vlm"

  # Approach 1 text LLM — used by ocr_llm_extractor.py via mlx-lm
  ocr_llm:
    name: "mlx-community/Qwen2.5-1.5B-Instruct-4bit"
    framework: "mlx-lm"
    adapter_path: "checkpoints/verifylens-adapter"

  # Face — actual implementation uses MTCNN + InceptionResnetV1 (facenet-pytorch)
  face:
    detector: "mtcnn"
    embedder: "inceptionresnetv1"
    similarity_threshold: 0.65

  # CLIP document classifier
  clip:
    model: "ViT-L/14"
    doc_classes:
      - "aadhaar card"
      - "pan card"
      - "indian passport"
      - "driving license"


# ── Training (Approach 1 LoRA fine-tuning via mlx-lm) ───────
training:
  lora:
    r: 16
    lora_alpha: 32
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    lora_dropout: 0.05
    bias: "none"
    task_type: "CAUSAL_LM"

  sft:
    output_dir: "./checkpoints/qwen2vl-verifylens"
    num_train_epochs: 3
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-4
    lr_scheduler_type: "cosine"
    warmup_ratio: 0.05
    fp16: false
    bf16: true
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    load_best_model_at_end: true
    report_to: "none"
    max_seq_length: 1024


# ── Data ─────────────────────────────────────────────────────
data:
  synthetic:
    num_samples: 5000
    doc_types: ["aadhaar", "pan", "passport", "driving_license"]
    augmentations: true
  train_split: 0.85
  val_split: 0.15


# ── API ──────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  max_image_size_mb: 10
  confidence_threshold: 0.70
