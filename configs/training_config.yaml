model:
  vlm:
    name: "Qwen/Qwen2-VL-2B-Instruct"
    load_in_4bit: true
    bnb_4bit_compute_dtype: "float16"
    bnb_4bit_quant_type: "nf4"
    use_nested_quant: false

  face:
    detector: "retinaface"
    embedder: "arcface"
    similarity_threshold: 0.65

  clip:
    model: "ViT-L/14"
    doc_classes:
      - "aadhaar card"
      - "pan card"
      - "indian passport"
      - "driving license"

training:
  lora:
    r: 16
    lora_alpha: 32
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    lora_dropout: 0.05
    bias: "none"
    task_type: "CAUSAL_LM"

  sft:
    output_dir: "./checkpoints/qwen2vl-verifylens"
    num_train_epochs: 3
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-4
    lr_scheduler_type: "cosine"
    warmup_ratio: 0.05
    fp16: false
    bf16: true
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    load_best_model_at_end: true
    report_to: "none"
    max_seq_length: 1024

data:
  synthetic:
    num_samples: 5000
    doc_types: ["aadhaar", "pan", "passport", "driving_license"]
    augmentations: true
  train_split: 0.85
  val_split: 0.15

api:
  host: "0.0.0.0"
  port: 8000
  max_image_size_mb: 10
  confidence_threshold: 0.70
